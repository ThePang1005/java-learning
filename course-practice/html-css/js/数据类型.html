    <script>

        function add(a,b){//函数声明
            return a+b;
        }
        let c = add(10,20);
        console.log(c);//30
        console.log(typeof c);//number

        let d = function(a,b){//匿名函数
            return a-b;
        }
        let e = d(10,20);
        console.log(e);//-10
        console.log(typeof e);//number

        let f = (a,b)=>{//箭头函数
            return a*b;
        }
        let g = f(10,20);  
        console.log(g);//200
        console.log(typeof g);//number
    </script>

</body>
