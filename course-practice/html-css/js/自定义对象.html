<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自定义对象</title>
</head>
<body>
    
    <script>
        let user = {
            name:"张三",
            age:18,
            sex:"男",
            sing(){
                alert(this.name+"会唱歌");
            }
        }
        // user.sing();
        // alert(user.name);

        let person = {
            name:"李四",
            age:18,
            sex:"女",
        }
        alert(JSON.stringify(person));  //将js对象转换为json字符串

        let personJson = '{"name":"王五","age":18,"sex":"女"}';  
        alert(JSON.parse(personJson).name); //将json字符串转换为js对象

    </script>

</body>
</html>
