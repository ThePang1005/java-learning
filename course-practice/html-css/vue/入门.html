<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入门</title>
</head>
<body>
    
    <div id="app">
        <h1>{{ message }}</h1>
        <p>{{ count }}</p>
    </div>

    <script type="module">
        import { createApp } from "https://unpkg.com/vue@3/dist/vue.esm-browser.js"

        createApp({
            data() {
                return {
                    message: 'hello vue',
                    count: 100
                }
            }
        }).mount('#app')

    </script>

</body>
</html>
